{% extends "learning_logs/base.html" %}
{% load bootstrap4 %}
{% block page_header %}
    <h1>New entry for "{{ topic }}": </h1>
{% endblock page_header %}

{% block content %}
<form action="{% url 'learning_logs:new_entry' topic.id %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% buttons %}
      <button name="submit" class="btn btn-primary">New entry</button>
    {% endbuttons %}
  </form>
{% endblock content %}
