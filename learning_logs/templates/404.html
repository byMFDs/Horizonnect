{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Horizonnect</title>
    <link rel="icon" type="image/jpeg" href="{% static 'my_logo.jpg' %}">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .page-title {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #212529;
            letter-spacing: -0.5px;
        }
        .error-card {
            background: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 40px 30px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .error-card h2 {
            font-size: 24px;
            font-weight: 700;
            color: #007bff;
            margin-bottom: 12px;
        }
        .error-card p {
            font-size: 15px;
            color: #6c757d;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn-primary {
            display: inline-block;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 5px;
            font-weight: 500;
            font-size: 15px;
            transition: background-color 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .footer {
            text-align: center;
            padding: 25px 20px;
            font-size: 13px;
            color: #6c757d;
            background-color: #f8f9fa;
        }
        .footer a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-rights {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1 class="page-title">[ 404 ]</h1>

        <div class="error-card">
            <h2>Page Not Found</h2>
            <p>The page you are looking for doesn't exist or has been moved.</p>
            <a href="{% url 'learning_logs:index' %}" class="btn-primary">Return Home »</a>
        </div>
    </div>

    <div class="footer">
        A <strong>Danylo Rudenko</strong> Production • <a href="{% url 'learning_logs:index' %}">Horizonnect</a> © 2026
        <span class="footer-rights">ALL RIGHTS RESERVED</span>
    </div>

</body>
</html>
